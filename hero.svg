<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
<title id="title">Omar Mahmood | SOC and Red Team Lead</title>
<desc id="desc">A minimal dark blue cybersecurity banner with an OM monogram and a subtle animated accent. Core identity and specialties are also written in the profile README.</desc>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#50d4e6" stop-opacity=".75"/>
    <stop offset="1" stop-color="#8175f5" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#50d4e6"/>
    <stop offset=".58" stop-color="#8175f5"/>
    <stop offset="1" stop-color="#50d4e6"/>
  </linearGradient>
  <radialGradient id="glow" cx="1" cy=".5" r=".75">
    <stop offset="0" stop-color="#5c56ba" stop-opacity=".22"/>
    <stop offset="1" stop-color="#101827" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#b7c6da" stroke-opacity=".045"/>
  </pattern>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
    .trace { stroke-dasharray: 180 1020; animation: trace 8s linear infinite; }
    @keyframes trace { to { stroke-dashoffset: -1200; } }
    @media (prefers-reduced-motion: reduce) { .trace { animation: none; } }
  </style>
</defs>
<rect width="1200" height="320" rx="24" fill="#101827"/>
<rect width="1200" height="320" rx="24" fill="url(#glow)"/>
<rect width="1200" height="320" rx="24" fill="url(#grid)"/>
